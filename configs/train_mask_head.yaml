seed: 42

run:
  output_dir: runs/retfound_mask
  name: main9_maskfirst

data:
  train_index: labels_native/uwf700_train_global.jsonl
  val_index: labels_native/uwf700_val_global.jsonl
  class_map_active: labels_native/class_map_active.json
  image_size: 128
  keep_empty: true

model:
  vendor_dir: third_party/RETFound_MAE
  retfound_ckpt: models/retfound/RETFound_cfp_weights.pth
  adapt_ckpt: runs/retfound_adapt/main9_contrastive/best.pt
  decoder_channels: 64

train:
  device: cpu
  epochs: 5
  batch_size: 1
  eval_batch_size: 1
  num_workers: 0
  lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  freeze_blocks: 24
  balanced_sampler: False
  amp: False

eval:
  mask_threshold: 0.5
